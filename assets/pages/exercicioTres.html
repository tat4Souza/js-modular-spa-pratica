<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-registration-form image="icon-star-group-3">
      <custom-input
        name="sto-ord-id"
        title="Código da Ordem"
        type="text"
      ></custom-input>

      <custom-input
        name="sto-prod-id"
        title="Código do Produto"
        type="text"
      ></custom-input>

      <custom-input
        name="sto-prod-type"
        title="Tipo do Produto"
        type="select"
        options="Padrão, Premium, Sob encomenda"
      ></custom-input>

      <custom-input
        name="sto-qtd"
        title="Quantidade produzida"
        type="number"
        step="1"
      ></custom-input>

      <custom-input
        name="sto-prod-price"
        title="Custo unitário"
        type="number"
      ></custom-input>

      <custom-input
        name="sto-initial"
        title="Estoque inicial"
        type="number"
        step="1"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <custom-report-container title="Terceiro">
      <h5 class="report__title">Estoque final por tipo de produto:</h5>
      <div class="ancorComponent" id="rep-final-stock"></div>

      <h5 class="report__title">Informações dos pedidos:</h5>
      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>maior custo:</h4>
        <div id="rep-high" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>menor custo:</h4>
        <div id="rep-low" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--half">
        <h4><span>R$</span> <label id="rep-invested"></label></h4>
        <span>Total investido</span>
      </div>

      <div class="report__grid report__grid--half">
        <h4><span>R$</span> <label id="rep-avg"></label></h4>
        <span>Média custo total</span>
      </div>

      <h5 class="report__title">Alertas de estoque:</h5>
      <div class="ancorComponent" id="rep-alerts"></div>

      <h5 class="report__title">Informações dos produtos:</h5>
      <div class="ancorComponent" id="rep-prod-info"></div>
    </custom-report-container>
  </section>
</div>
