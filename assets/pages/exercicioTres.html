<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-registration-form image="icon-star-group-3">
      <custom-input
        name="sto-ord-id"
        title="Código da Ordem"
        type="text"
      ></custom-input>

      <custom-input
        name="sto-prod-id"
        title="Código do Produto"
        type="text"
      ></custom-input>

      <custom-input
        name="sto-prod-type"
        title="Tipo do Produto"
        type="select"
        options="Padrão, Premium, Sob encomenda"
      ></custom-input>

      <custom-input
        name="sto-qtd"
        title="Quantidade produzida"
        type="number"
      ></custom-input>

      <custom-input
        name="sto-prod-price"
        title="Custo unitário"
        type="text"
      ></custom-input>

      <custom-input
        name="sto-initial"
        title="Estoque inicial"
        type="number"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <h2>Relatório</h2>
    <ul>
      <li>Total de ordens registradas: <span id="rep-total"></span></li>
      <li>
        Estoque final dos produtos:
        <div id="rep-final-stock"></div>
      </li>
      <li>Média de custo total: <span id="rep-avg"></span></li>
      <li>
        Ordem com maior custo:
        <div id="rep-high"></div>
      </li>
      <li>
        Ordem com menor custo:
        <div id="rep-low"></div>
      </li>
      <li>
        Alertas:
        <div id="rep-alerts"></div>
      </li>
      <li>
        Informações dos produtos:
        <div id="rep-prod-info"></div>
      </li>
      <li>Valor total investido: <span id="rep-invested"></span></li>
    </ul>
  </section>
</div>
