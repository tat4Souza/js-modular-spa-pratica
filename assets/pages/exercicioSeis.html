<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Sexto"
      desc="Uma rede de lojas quer controlar as vendas dos seus vendedores, com comissões e análise de metas. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="monthly-goal"
        title="Meta mensal de vendas"
        type="number"
      ></custom-input>

      <custom-input
        name="base-comission"
        title="Precentual base de comissão"
        type="number"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-6" combo="true">
      <custom-input
        name="sale-id"
        title="Código de venda"
        type="text"
      ></custom-input>

      <custom-input
        name="sale-seller-id"
        title="Código do vendedor"
        type="text"
      ></custom-input>

      <custom-input
        name="sale-reg"
        title="Região da loja"
        type="select"
        options="Norte, Nordeste, Sudeste, Sul"
      ></custom-input>

      <custom-input
        name="sale-value"
        title="Valor da venda"
        type="number"
      ></custom-input>

      <custom-input
        name="sale-client-type"
        title="Tipo de cliente"
        type="select"
        options="Pessoa Física, Pessoa Jurídica"
        full="true"
      ></custom-input>
    </custom-registration-form>
  </section>
  <section class="hideComponent section-reports" id="sectionReports">
    <custom-report-container title="Sexto">
      <h5 class="report__title">Total vendido por região:</h5>
      <div class="ancorComponent" id="rep-total-region"></div>

      <h5 class="report__title">Total por tipo de cliente:</h5>
      <div class="ancorComponent" id="rep-total-client"></div>

      <h5 class="report__title">Informações sobre os vendedores:</h5>
      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>maior valor de vendas:</h4>
        <div id="rep-seller-value" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>maior valor de comissão:</h4>
        <div id="rep-seller-comission" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full">
        <h4>Bateram a meta:</h4>
        <span class="report__total" id="rep-seller-goal"></span>
      </div>

      <h5 class="report__title">Informações sobre comissões:</h5>
      <div class="report__grid report__grid--full">
        <h4>Média geral</h4>
        <span class="report__total"
          >R$ <label id="rep-comission-avg"></label
        ></span>
      </div>
      <div class="ancorComponent" id="rep-comission-avg-reg"></div>
    </custom-report-container>
  </section>
</div>
