<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Segundo"
      desc="Uma rede hoteleira deseja aprimorar ainda mais sua folha de pagamento mensal, incluindo agora bônus por desempenho baseado em avaliações internas. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="minWage"
        type="number"
        title="Salário Mínimo"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-2" combo="true">
      <custom-input
        name="emp-id"
        title="Código do Funcionário"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-hours"
        title="Horas trabalhadas"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-cat"
        title="Categoria"
        type="select"
        options="Funcionário Operacional, Gerente"
      ></custom-input>

      <custom-input
        name="emp-shift"
        title="Turno"
        type="select"
        options="Matutino, Vespertino, Noturno"
      ></custom-input>

      <custom-input
        name="emp-perf"
        title="Desempenho mensal"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-food"
        title="Auxílio alimentação"
        type="number"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <h2>Relatório:</h2>
    <ul>
      <li>
        Quantidade total de funcionários cadastrados:
        <span id="rep-total"></span>
      </li>
      <li>
        Média salarial geral dos funcionários cadastrados:
        <div id="rep-avg"></div>
      </li>
      <li>
        Funcionário mais pago:
        <div id="rep-high"></div>
      </li>
      <li>
        Funcionário menos pago:
        <div id="rep-low"></div>
      </li>
      <li>
        Quantidade de funcionários que receberam cada faixa de bônus:
        <div id="rep-bonus"></div>
      </li>
    </ul>
  </section>
</div>
