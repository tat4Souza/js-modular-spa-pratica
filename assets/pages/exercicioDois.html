<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Segundo"
      desc="Uma rede hoteleira deseja aprimorar ainda mais sua folha de pagamento mensal, incluindo agora bônus por desempenho baseado em avaliações internas. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="minWage"
        type="number"
        title="Salário Mínimo"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-2" combo="true">
      <custom-input
        name="emp-id"
        title="Código do Funcionário"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-hours"
        title="Horas trabalhadas"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-cat"
        title="Categoria"
        type="select"
        options="Funcionário Operacional, Gerente"
      ></custom-input>

      <custom-input
        name="emp-shift"
        title="Turno"
        type="select"
        options="Matutino, Vespertino, Noturno"
      ></custom-input>

      <custom-input
        name="emp-perf"
        title="Desempenho mensal"
        type="text"
      ></custom-input>

      <custom-input
        name="emp-food"
        title="Auxílio alimentação"
        type="number"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <custom-report-container title="Segundo">
      <div class="ancorComponent" id="rep-avg"></div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>mais pago:</h4>
        <div id="rep-high" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>menos pago:</h4>
        <div id="rep-low" class="ancorComponent"></div>
      </div>

      <h5 class="report__title">Funcionários em cada faixa de bônus:</h5>
      <div class="ancorComponent" id="rep-bonus"></div>
    </custom-report-container>
  </section>
</div>
