<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Quinto"
      desc="Um clube de futebol quer controlar os treinos dos atletas e monitorar risco de sobrecarga. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="max-workout"
        title="Carga máxima semanal recomendada"
        type="text"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-5" combo="true">
      <custom-input
        name="work-id"
        title="Código do treino"
        type="text"
      ></custom-input>

      <custom-input
        name="work-name"
        title="Nome do Jogador"
        type="text"
      ></custom-input>

      <custom-input
        name="work-pos"
        title="Posição"
        type="select"
        options="Goleiro, Zagueiro, Meio-campo, Atacante"
      ></custom-input>

      <custom-input
        name="work-type"
        title="Tipo de treino"
        type="select"
        options="Físico, Técnico, Estratégico"
      ></custom-input>

      <custom-input
        name="work-dur"
        title="Duração em minutos"
        type="text"
      ></custom-input>

      <custom-input
        name="work-inten"
        title="Intensidade"
        type="number"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <h2>Relatório</h2>
    <ul>
      <li>Total de treinos cadastrados: <span id="rep-total"></span></li>
      <li>
        Lista de Jogadores:
        <div id="rep-players"></div>
      </li>
      <li>
        Jogador com maior carga semanal:
        <div id="rep-max-load"></div>
      </li>
      <li>
        Jogador com menor carga semanal:
        <div id="rep-min-load"></div>
      </li>
      <li>
        Quantidade de Jogadores com risco de lesão: <span id="rep-risk"></span>
      </li>
      <li>
        Carga média por tipo de treino:
        <div id="rep-work-type"></div>
      </li>
      <li>
        Informações por posição:
        <div id="rep-pos-info"></div>
      </li>
    </ul>
  </section>
</div>
