<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Quinto"
      desc="Um clube de futebol quer controlar os treinos dos atletas e monitorar risco de sobrecarga. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="max-workout"
        title="Carga máxima semanal recomendada"
        type="number"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-5" combo="true">
      <custom-input
        name="work-id"
        title="Código do treino"
        type="text"
      ></custom-input>

      <custom-input
        name="work-name"
        title="Nome do Jogador"
        type="text"
      ></custom-input>

      <custom-input
        name="work-pos"
        title="Posição"
        type="select"
        options="Goleiro, Zagueiro, Meio-campo, Atacante"
      ></custom-input>

      <custom-input
        name="work-type"
        title="Tipo de treino"
        type="select"
        options="Físico, Técnico, Estratégico"
      ></custom-input>

      <custom-input
        name="work-dur"
        title="Duração em minutos"
        type="number"
      ></custom-input>

      <custom-input
        name="work-inten"
        title="Intensidade"
        type="number"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <custom-report-container title="Quinto">
      <h5 class="report__title">Informações dos jogadores:</h5>
      <div class="ancorComponent" id="rep-players"></div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>maior carga semanal:</h4>
        <div id="rep-max-load" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>menor carga semanal:</h4>
        <div id="rep-min-load" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full">
        <h4>Jogadores com risco de lesão:</h4>
        <span class="report__total" id="rep-risk"></span>
      </div>

      <h5 class="report__title">Carga média por tipo de treino:</h5>
      <div class="ancorComponent" id="rep-work-type"></div>

      <h5 class="report__title">Informações por posição:</h5>
      <div class="ancorComponent" id="rep-pos-info"></div>
    </custom-report-container>
  </section>
</div>
