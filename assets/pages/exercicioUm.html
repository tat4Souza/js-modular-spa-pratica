<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Primeiro"
      desc="Uma empresa metalmecânica precisa automatizar ainda mais o cálculo do frete para melhorar sua logística. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="gas"
        title="Valor do combustível por Litro"
        type="number"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star" combo="true">
      <custom-input
        name="ord-id"
        title="Código do pedido"
        type="text"
      ></custom-input>

      <custom-input
        name="ord-region"
        title="Região"
        type="select"
        options="Sudeste (R$ 1.20 por peça), Sul (R$ 1.30 por peça), Centro-Oeste (R$ 1.50 por peça)"
      ></custom-input>

      <custom-input
        name="ord-distance"
        title="Distância (em km)"
        type="number"
      ></custom-input>

      <custom-input
        name="ord-qtd-parts"
        title="Quantidade de peças"
        type="number"
      ></custom-input>

      <custom-input
        name="ord-tracking"
        title="Rastreamento (R$ 200)"
        type="checkbox"
        full="true"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section id="sectionReports" class="hideComponent section-reports">
    <div class="form__container report__container">
      <div class="form__header report__header">
        <figure class="form__img-container">
          <img src="./assets/img/upper-bite.png" alt="Mordida Cima" />
        </figure>
        <h3>Primero Exercício</h3>
        <h2 class="form__title">Relatório</h2>
        <figure class="form__img-container">
          <img src="./assets/img/lower-bite.png" alt="Mordida Baixo" />
        </figure>
      </div>

      <div class="form__content report__content">
        <div class="report__grid report__grid--full">
          <h4>Total:</h4>
          <span class="report__total" id="rep-total"></span>
        </div>
        <div class="report__grid">
          <h4 id="rep-order-avg"><span>R$</span> 50</h4>
          <span>Média por pedido</span>
        </div>
        <div class="report__grid report__grid--half">
          <h4>Valor por região:</h4>
          <div id="rep-reg"></div>
        </div>
        <div class="report__grid report__grid--full">
          <h4>mais caro:</h4>
          <div id="rep-exp"></div>
        </div>
        <div class="report__grid report__grid--full">
          <h4>mais barato:</h4>
          <div id="rep-cheap"></div>
        </div>
      </div>
    </div>
  </section>
</div>
