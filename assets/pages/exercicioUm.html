<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Primeiro"
      desc="Uma empresa metalmecânica precisa automatizar ainda mais o cálculo do frete para melhorar sua logística. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="gas"
        title="Valor do combustível por Litro"
        type="number"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star" combo="true">
      <custom-input
        name="ord-id"
        title="Código do pedido"
        type="text"
      ></custom-input>

      <custom-input
        name="ord-region"
        title="Região"
        type="select"
        options="Sudeste (R$ 1.20 por peça), Sul (R$ 1.30 por peça), Centro-Oeste (R$ 1.50 por peça)"
      ></custom-input>

      <custom-input
        name="ord-distance"
        title="Distância (em km)"
        type="number"
      ></custom-input>

      <custom-input
        name="ord-qtd-parts"
        title="Quantidade de peças"
        type="number"
      ></custom-input>

      <custom-input
        name="ord-tracking"
        title="Rastreamento (R$ 200)"
        type="checkbox"
        full="true"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section id="sectionReports" class="hideComponent section-reports">
    <h2>Relatório</h2>
    <ul>
      <li>Número total de pedidos realizados: <span id="rep-total"></span></li>
      <li>Valor médio pago por pedido: <span id="rep-order-avg"></span></li>
      <li>
        Valor por região:
        <div id="rep-reg"></div>
      </li>
      <li>
        Pedido mais caro:
        <div id="rep-exp"></div>
      </li>
      <li>
        Pedido mais barato:
        <div id="rep-cheap"></div>
      </li>
    </ul>
  </section>
</div>
