<div class="main-content__container">
  <section class="ex__container" id="sectionForms">
    <custom-setting-form
      title="Quarto"
      desc="Uma rede hoteleira quer controlar reservas usando tarifação dinâmica por tipo de quarto e temporada. <br> (*) Preencha as informações para continuar."
    >
      <custom-input
        name="daily-rate"
        title="Valor base da diária"
        type="text"
      ></custom-input>

      <custom-input
        name="breakfast"
        title="Valor base do café da manhã"
        type="text"
      ></custom-input>
    </custom-setting-form>

    <custom-registration-form image="icon-star-group-4" combo="true">
      <custom-input
        name="res-id"
        title="Código de reserva"
        type="text"
      ></custom-input>

      <custom-input
        name="res-type"
        title="Tipo de quarto"
        type="select"
        options="Standard, Luxo, Premium"
      ></custom-input>

      <custom-input
        name="res-season"
        title="Temporada"
        type="select"
        options="Baixa, Alta, Feriado"
      ></custom-input>

      <custom-input
        name="res-daily"
        title="Quantidade de diárias"
        type="number"
      ></custom-input>

      <custom-input
        name="res-guests"
        title="Número de hóspedes"
        type="number"
      ></custom-input>

      <custom-input
        name="res-break"
        title="Café da manhã"
        type="checkbox"
      ></custom-input>
    </custom-registration-form>
  </section>

  <section class="hideComponent section-reports" id="sectionReports">
    <custom-report-container title="Quarto">
      <h5 class="report__title">Total por tipo de quarto:</h5>
      <div class="ancorComponent" id="rep-total-type"></div>

      <h5 class="report__title">Total por temporada:</h5>
      <div class="ancorComponent" id="rep-total-season"></div>

      <h5 class="report__title">Informações das reservas:</h5>
      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>maior custo:</h4>
        <div id="rep-expensive" class="ancorComponent"></div>
      </div>

      <div class="report__grid report__grid--full report__grid--full--col">
        <h4>menor custo:</h4>
        <div id="rep-cheap" class="ancorComponent"></div>
      </div>

      <div class="report__grid">
        <h4><span>R$</span><label id="rep-avg"></label></h4>
        <span>Média por reserva</span>
      </div>

      <div class="report__grid">
        <h4><span>R$</span><label id="rep-avg-guest"></label></h4>
        <span>Média por hóspede</span>
      </div>

      <div class="report__grid">
        <h4><span id="rep-ocupation">$</span></h4>
        <span>Valor de Ocupação</span>
      </div>

      <h5 class="report__title">Reservas com e sem café da manhã:</h5>
      <div class="report__grid report__grid--half">
        <h4><span id="rep-breakfast-w">$</span></h4>
        <span>Incluso</span>
      </div>

      <div class="report__grid report__grid--half">
        <h4><span id="rep-breakfast-wo">$</span></h4>
        <span>Não incluso</span>
      </div>
    </custom-report-container>
  </section>
</div>
